name: ci
on: [push, pull_request]
jobs:
  toolchain-free:          # always runs: parser, passes, metadata schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .[dev]
      - run: pytest -m "not needs_lldb and not needs_mlir" -v

  lldb-docker:             # hosted runners have no importable lldb module
    runs-on: ubuntu-latest
    continue-on-error: true        # honestly reported as partial, never silently skipped
    container:
      image: silkeh/clang:17
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined   # lldb must ptrace the demo
    steps:
      - uses: actions/checkout@v4
      # Debian's python3-lldb-14 symlinks _lldb.so to liblldb.so, which only
      # liblldb-14-dev provides; without it `import lldb` fails.
      - run: apt-get update && apt-get install -y lldb python3-lldb liblldb-14-dev python3-pip cmake ninja-build
      - run: pip install -e .[dev] --break-system-packages
      - run: ./scripts/probe-toolchain.sh
      - name: Check LLDB's Python module imports
        run: python3 -c 'import mlir_lldb_tools._bootstrap as b; print("lldb OK:", b.ensure_lldb().__file__)'
      - run: ./scripts/build.sh && pytest -m needs_lldb -v