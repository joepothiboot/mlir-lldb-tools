name: ci
on: [push, pull_request]
jobs:
  toolchain-free: # always runs: parser, passes, metadata schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .[dev]
      - run: pytest -m "not needs_lldb and not needs_mlir" -v

  lldb-docker: # hosted runners have no importable lldb module
    runs-on: ubuntu-latest
    continue-on-error: true # honestly reported as partial, never silently skipped
    container:
      image: silkeh/clang:17
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined # lldb must ptrace the demo
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y lldb python3-lldb python3-pip cmake ninja-build
      # Debian's python3-lldb-14 ships _lldb.*.so -> ../../../../../lib/liblldb.so,
      # which resolves to the nonexistent /usr/lib/lib/liblldb.so. Repoint it.
      - name: Repair python3-lldb symlink
        run: |
          for so in /usr/lib/llvm-*/lib/python3*/dist-packages/lldb/_lldb.cpython-*.so; do
            [ -e "$so" ] || ln -sfv "$(ls /usr/lib/*-linux-gnu/liblldb-*.so.1 | head -1)" "$so"
          done
      - run: pip install -e .[dev] --break-system-packages
      - run: ./scripts/probe-toolchain.sh
      - name: Point liblldb at lldb-server
        run: echo "LLDB_DEBUGSERVER_PATH=$(ls /usr/lib/llvm-*/bin/lldb-server | head -1)" >> "$GITHUB_ENV"
      - name: Check LLDB's Python module imports
        run: python3 -c 'import mlir_lldb_tools._bootstrap as b; print("lldb OK:", b.ensure_lldb().__file__)'
      - run: ./scripts/build.sh && pytest -m needs_lldb -v
