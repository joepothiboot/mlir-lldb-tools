[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlir-lldb-tools"
version = "0.1.0"
description = "Domain-aware LLDB tooling for a small MLIR-based compiler"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []                     # lldb is NOT pip-installable; see _bootstrap
[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]
[project.scripts]
schemac = "schemac.cli:main"
mlir-dap = "mlir_lldb_tools.dap.server:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mlir_lldb_tools*", "schemac*"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
markers = ["needs_lldb: requires an importable lldb module",
           "needs_mlir: requires schemac-opt built against real MLIR"]